# NTC 功率热敏电阻工艺视角参数模板（浪涌抑制型）
# v0.1.1：按小G"砍到 8+1" + 小k"补 max_load_capacitance (P0) / packaging"收敛
category: NTC 功率热敏电阻 (Inrush Current Limiter)
fields:
  - key: supplier
    name: 供应商
    hint: 制造商/品牌，如 TDK(EPCOS), Vishay, 兴勤, 时恒
  - key: part_number
    name: 型号
    hint: 具体料号；系列料表时取 --part 指定的那一行
  - key: r25
    name: 25°C 零功率阻值
    unit: Ω
    hint: Resistance @25°C 及容差，如 5Ω ±20%
  - key: max_steady_current
    name: 最大稳态电流
    unit: A
    hint: Max Steady State Current @25°C
  - key: max_load_capacitance
    name: 最大允许电容量 (240Vac)
    unit: µF
    hint: Max. Load Capacitance @240Vac——按母线电容选 NTC 的第一参数，兴勤/时恒 datasheet 必标
  - key: b_constant
    name: B 值
    unit: K
    hint: B Constant，如 B25/50=2800K
    note: B 值厂商而异（2026-08-02 实测三份原文）：时恒 MF72 规格承认书电气性能表明确标 B25/50（如 2800K±10%）；兴勤 SCK、Cantherm MF72 规格表不列 B 值（Cantherm 仅在特性栏写 "High material constant (B value)"，无数值）。原文有则必须提取，无则标 not_in_datasheet 并附溯源。
  - key: thermal_time_constant
    name: 热时间常数
    unit: s
    hint: Thermal / Cooling Time Constant
  - key: max_power
    name: 最大额定功率
    unit: W
    hint: Max Power Rating @25°C
  - key: operating_temp
    name: 工作温度范围
    hint: 如 -40~+175°C
  - key: packaging
    name: 包装形式
    hint: Bulk / Tape&Reel / Ammo
